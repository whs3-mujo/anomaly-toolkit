<!DOCTYPE html>
{% load static %}
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>분석 대시보드</title>
    <style>
        body {
            margin: 0;
            height: 100vh;          
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f7fa;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .history-item {
  background: white;
  border: 1px solid #e9ecef;
  border-radius: 8px;
  padding: 12px 12px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.2s ease;
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  min-height: 72px;
}

.history-item:hover {
  background: #f8f9fa;
  border-color: #007bff;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,123,255,0.1);
}

.history-item.selected {
  background: #e3f2fd;
  border-color: #2196f3;
}

.history-item .filename {
  font-size: 1.02rem;
  font-weight: 600;
  color: #222;
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.history-item .filename {
  color: #173a7d;
  font-weight: 700;
  font-size: 1.04rem;
}

.history-item .meta {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.92rem;
  color: #6c757d;
  flex-shrink: 0;
}

.file-type-badge {
  padding: 2px 6px;
  border-radius: 10px;
  font-size: 0.82rem;
  font-weight: 500;
  background: #e3f2fd;
  color: #1976d2;
  margin-left: 2px;
}

.session-time {
  color: #1976d2;
  font-size: 0.97em;
}

.rename-btn, .delete-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1em;
  margin-left: 2px;
  margin-right: 0;
  padding: 0 2px;
}

.rename-btn { color: #1976d2; }
.delete-btn { color: #dc3545; }

        .result-header {
            background: linear-gradient(90deg, #1976d2 60%, #42a5f5 100%);
            color: #fff;
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
            border: none;
            box-shadow: 0 2px 8px rgba(23,58,125,0.06);
        }

        .result-header h2,
        .result-header span {
            color: #fff !important;
        }

        .result-header .status-badge {
            background: #28a745;
            color: #fff;
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            margin-left: 1rem;
        }

        .result-content {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 1.5rem;
        }

        .table {
      width: 100%;
      min-width: 900px; 
      border-collapse: collapse;
      font-size: 0.95rem;
      margin-top: 0.5rem;
    }
    .table th, .table td {
      border: 1px solid #dee2e6;
      padding: 4px 8px;
      text-align: right;
    }
    .table th {
      background: #f1f3f5;
      color: #495057;
      font-weight: 600;
    }
    .table tr:nth-child(even) {
      background: #f8f9fa;
    }
    
    .selected-row {
      background-color: #e3f2fd !important; 
    }
    table tbody tr:hover {
      background-color: #f1f3f5; 
      cursor: pointer;
    }

    .table thead th { 
      position: sticky;
      top: 0;
      background: #f1f3f5;
      z-index: 2;
    }

    .dashboard-graphs-card {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #e9ecef;
      padding: 1.2rem 1.5rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 2px 12px rgba(23,58,125,0.06);
      margin-bottom: 1rem;
      width: 100%;
      margin-right: 0;
      max-width: calc(100% - 60px);
    }
    
    .dashboard-graphs-row {
      display: flex;
      gap: 1.2rem;
      min-height: 220px;
      flex-wrap: nowrap;
      width: 100%;
    }
    
    .dashboard-graph-box {
      flex: 1 1 0;
      min-width: 0;
      background: #f9fafb;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      padding: 0.5rem;
      display: flex;
      align-items: stretch;
      height: 220px;
      box-shadow: 0 1px 4px rgba(23,58,125,0.04);
      overflow: hidden;
    }
    
    .dashboard-graph-inner {
      width: 100%;
      height: 100%;
      min-width: 0;
      overflow: hidden;
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }
    
    .dashboard-graph-inner > div,
    .dashboard-graph-inner > iframe,
    .dashboard-graph-inner > .plotly-graph-div {
      width: 100% !important;
      height: 100% !important;
      min-width: 0 !important;
      min-height: 0 !important;
      max-width: 100% !important;
      max-height: 100% !important;
      box-sizing: border-box;
    }
    
    .dashboard-graph-bottom {
      height: 260px;
      min-width: 0;
      background: #f9fafb;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      padding: 0.5rem;
      margin-top: 1.2rem;
      box-shadow: 0 1px 4px rgba(23,58,125,0.04);
      width: 100%;
    }
    
    .dashboard-table-area {
      background: white;
      border-radius: 12px;
      border: 1.5px solid #e9ecef;
      padding: 1.2rem 1.5rem 1.5rem 1.5rem;
      margin-bottom: 1rem;
      flex: 1;
      min-height: 300px;
      max-width: 100%;
      box-shadow: 0 2px 12px rgba(23,58,125,0.06);
      display: flex;
      flex-direction: column;
      position: relative;
      width: 100%;
      max-width: calc(100% - 60px);
      margin-right: 0;
    }
    
    .dashboard-table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.7rem;
      flex-wrap: wrap;
      gap: 0.5rem;
      z-index: 2;
      position: relative;
      background: white;
    }
    
    .dashboard-table-header .download-btns {
      display: flex;
      gap: 0.5rem;
    }
    
    .dashboard-table-scroll {
      max-height: 400px;
      overflow-y: auto;
      overflow-x: auto;
    }
    
    .dashboard-table-inner {
      min-width: 900px;
    }

    .dashboard-shap-section {
      display: flex;
      gap: 1.2rem;
      width: 99.5%;
      align-items: flex-start;
    }
    
    .dashboard-shap-plot {
      background: white;
      border: 1.5px solid #e9ecef;
      border-radius: 10px;
      padding: 1.5rem;
      height: 550px; 
      min-width: 0;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(23,58,125,0.04);
      flex: 2 1 0; 
    }
    
    .dashboard-shap-inner {
      height: 100%;
      width: 100%;
      min-width: 0;
    }
    
    .dashboard-shap-explain {
      background: white;
      border: 1.5px solid #e9ecef;
      border-radius: 10px;
      padding: 1.5rem;
      height: 550px; 
      min-width: 0;
      overflow-y: auto;
      box-shadow: 0 1px 4px rgba(23,58,125,0.04);
      flex: 1 1 0;
      font-size: 1.08rem; 
      line-height: 1.7;
    }
    
    .dashboard-desc-area {
      background: white;
      border: 1.5px solid #e9ecef;
      border-radius: 10px;
      padding: 1.5rem;
      height: 550px; 
      overflow-y: auto;
      box-shadow: 0 1px 4px rgba(23,58,125,0.04);
      flex: 0 0 28%;       
      font-size: 1.08rem; 
      line-height: 1.7;  
    }

    .dashboard-shap-inner img {
      max-width: 100%;
      height: 700px;
      object-fit: contain;
    }

    .dashboard-shap-explain h4 {
      color: #1976d2;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      margin-top: 0;
      border-bottom: 2px solid #e3f2fd;
      padding-bottom: 0.5rem;
    }

    .dashboard-shap-explain ul {
      margin: 0;
      padding-left: 1.5rem;
    }

    .dashboard-shap-explain li {
      margin-bottom: 0.8rem;
      color: #495057;
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 500;  

    }

    .dashboard-shap-explain small {
      display: block;
      margin-top: 0.4rem;
      font-size: 0.95rem;
      color: #6c757d;
      font-style: italic;
      line-height: 1.4;
    }

    .dashboard-desc-area h3, .dashboard-desc-area h4 {
      color: #1976d2;
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1rem;
      margin-top: 1.5rem;
      border-bottom: 2px solid #e3f2fd;
      padding-bottom: 0.5rem;
    }

    .dashboard-desc-area h3:first-child, .dashboard-desc-area h4:first-child {
      margin-top: 0;
    }

    .dashboard-desc-area p {
      color: #495057;
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 1rem;
      font-weight: 400;
    }

    .dashboard-desc-area ul {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }

    .dashboard-desc-area li {
      margin-bottom: 0.7rem;
      color: #495057;
      font-size: 1.05rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .dashboard-shap-explain strong,
    .dashboard-desc-area strong {
      color: #1976d2;
      font-weight: 700;
    }

    .dashboard-shap-explain code,
    .dashboard-desc-area code {
      background: #f8f9fa;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      font-size: 0.95em;
      color: #e91e63;
      font-weight: 500;
    }
    
    .dashboard-shap-explain table {
      width: 100%;
      border-collapse: collapse;
      font-size: 1.02rem;
      margin-top: 0.5rem;
    }
    
    .dashboard-shap-explain table th {
      background: #f1f3f5;
      color: #495057;
      font-weight: 600;
      padding: 12px 15px;
      text-align: left;
      border: 1px solid #dee2e6;
    }
    
    .dashboard-shap-explain table th:last-child {
      text-align: center;
    }
    
    .dashboard-shap-explain table td {
      padding: 10px 15px;
      border: 1px solid #dee2e6;
      font-weight: 500;
    }
    
    .dashboard-shap-explain table tr:hover {
      background: #f8f9fa;
      transition: background 0.2s ease;
    }
    .contrib-high {
      background: #ffebee !important;
      color: #c62828 !important;
    }
    
    .contrib-medium {
      background: #fff3e0 !important;
      color: #ef6c00 !important;
    }
    
    .contrib-low {
      background: #fffde7 !important;
      color: #f57f17 !important;
    }
    
    .contrib-minimal {
      background: #e3f2fd !important;
      color: #1565c0 !important;
    }

    .dashboard-shap-explain::-webkit-scrollbar {
      width: 6px;
    }
    
    .dashboard-shap-explain::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 3px;
    }
    
    .dashboard-shap-explain::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }
    
    .dashboard-shap-explain::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }



    /* 상단 네비게이션 스타일 개선 */
    .top-navbar {
      display: flex;
      align-items: center;
      background: #f7f9fb;
      border-bottom: 1.5px solid #e3e6ea;
      height: 60px;
      padding: 0 32px;
      gap: 24px;
      box-shadow: 0 2px 8px rgba(23,58,125,0.03);
      position: relative;
      z-index: 100;
    }
    .top-navbar .logo-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #1976d2;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
      transition: color 0.15s;
    }
    .top-navbar .logo-btn:hover {
      color: #0d47a1;
    }
    .top-navbar .nav-link {
      font-size: 1.08rem;
      color: #495057;
      background: none;
      border: none;
      cursor: pointer;
      padding: 8px 18px;
      border-radius: 6px;
      font-weight: 500;
      transition: background 0.15s, color 0.15s;
      margin-left: 4px;
    }
    .top-navbar .nav-link.active,
    .top-navbar .nav-link:hover {
      background: #e3f2fd;
      color: #1976d2;
    }

    /* 사이드바 업로드 버튼 스타일 */
    .sidebar-upload-btn {
      width: 90%;
      margin: 18px auto 18px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(90deg, #1976d2 60%, #42a5f5 100%);
      color: #fff;
      font-size: 1.08rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 12px 0;
      box-shadow: 0 2px 8px rgba(23,58,125,0.08);
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .sidebar-upload-btn:hover {
      background: linear-gradient(90deg, #1565c0 60%, #1976d2 100%);
      box-shadow: 0 4px 16px rgba(23,58,125,0.13);
    }

    /* 히스토리 헤더(Detection History) 스타일 */
    .sidebar-history-title {
      font-size: 1.13rem;
      font-weight: bold;
      color: #1976d2;
      margin: 0 0 10px 18px;
      letter-spacing: 0.5px;
    }

    .history-item .filename {
      font-size: 1.08rem;
      font-weight: 700;
      color: #222;
    }
    .history-item .meta {
      font-size: 0.65rem;
    }
    
    @media (max-width: 1200px) {
      .dashboard-shap-section {
        flex-direction: column;
        gap: 1rem;
      }
      .dashboard-shap-plot, .dashboard-shap-explain, .dashboard-desc-area {
        height: 450px;
        flex: none;
      }
    }
    
    @media (max-width: 900px) {
      .dashboard-graphs-row {
        flex-direction: column;
        gap: 0.5rem;
      }
      .dashboard-graph-box, .dashboard-graph-bottom {
        height: 180px;
        min-width: 0;
      }
      .dashboard-shap-section {
        flex-direction: column;
        gap: 0.5rem;
      }
      .dashboard-shap-plot, .dashboard-shap-explain, .dashboard-desc-area {
        height: 350px;
      }
      .dashboard-graphs-card {
        padding: 0.7rem 0.5rem 1rem 0.5rem;
      }
      .dashboard-table-area {
        padding: 0.7rem 0.5rem;
      }
    }
    #delete-all-btn:hover {
      background-color: #dc3545 !important;
      color: #fff !important;
    }
    
    /* View All 버튼 호버 효과 */
    a[onclick*="goToViewAll"]:hover,
    a[onclick*="goToHourViewAll"]:hover {
      background: #1976d2 !important;
      color: #fff !important;
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(25, 118, 210, 0.3);
    }
    
    a[onclick*="goToViewAll"]:hover svg path,
    a[onclick*="goToHourViewAll"]:hover svg path,
    a[onclick*="goToViewAll"]:hover svg circle,
    a[onclick*="goToHourViewAll"]:hover svg circle,
    a[onclick*="goToViewAll"]:hover svg polyline,
    a[onclick*="goToHourViewAll"]:hover svg polyline {
      stroke: #fff !important;
      fill: #fff !important;
    }
    
    </style>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script> 


<style>
  /* 스플래시 전체 레이어 */
  #splash {
    position: fixed;
    inset: 0;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 99999; 
    opacity: 1;
    transition: opacity 300ms ease;
  }
  /* 페이드아웃 상태 */
  #splash.hide {
    opacity: 0;
    pointer-events: none;
  }
  /* 로고 컨테이너 */
  .splash-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .splash-logo {
    width: 700px;  
    height: auto;
  }
  .splash-text {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    font-size: 14px;
    color: #666;
    letter-spacing: .2px;
  }
</style>


</head>
<body>
  <div id="splash" role="status" aria-label="로딩 중">
  <div class="splash-content">
    <img class="splash-logo" src="{% static 'web/img/logsco_logo.png' %}" alt="서비스 로고">
    <div class="splash-text">로딩 중…</div>
  </div>
</div>

  <!-- 상단 네비게이션 -->
  <div class="top-navbar">
    <button class="logo-btn" onclick="location.href='{% url 'web:dashboard' %}'" title="대시보드로 이동">
      <img src="{% static 'web/img/logsco_logo_icon.png' %}" alt="LOGSCO 아이콘" width="50" height="50" style="border-radius: 4px;">
      <span>LOGSCO</span>
    </button>
    <button class="nav-link"
      onclick="const w=window.open('https://github.com/whs3-mujo/anomaly-toolkit','_blank'); if(w){ w.opener=null; w.focus(); }">
      GitHub
    </button>
  </div>

  <div style="display: flex; height: calc(100vh - 60px); position: relative;">

    <!-- 사이드바 -->
    <div id="history-sidebar"
      style="width: 300px; min-width: 0; max-width: 90vw; transition: width 0.25s cubic-bezier(.4,0,.2,1); background: #fff; border-right: 1px solid #e3e6ea; box-shadow: 1px 0 8px rgba(0,0,0,0.03); position: relative; z-index: 10; overflow-x: hidden; padding: 0 0 0 0;">
      <div style="display: flex; align-items: center; height: 56px; border-bottom: 1px solid #f1f3f5; padding: 0 16px;">
        <span class="sidebar-history-title" style="font-size: 1.13rem; font-weight: bold; color: #1976d2; letter-spacing: 0.5px; flex:1; margin: 0;">분석 히스토리</span>
        <button id="toggle-sidebar-btn"
          style="background: none; border: none; outline: none; cursor: pointer; padding: 6px; margin-left: 4px; border-radius: 50%; transition: background 0.15s;">
          <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M13 5L8 10L13 15" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <!-- 업로드 버튼 -->
      <button class="sidebar-upload-btn" onclick="location.href='{% url 'web:upload' %}'">
        <svg width="20" height="20" fill="none" viewBox="0 0 20 20"><rect width="20" height="20" rx="4" fill="#fff" fill-opacity="0"/><path d="M10 15V5M10 5L6 9M10 5l4 4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Upload New Log Files
      </button>
      <!-- 모두 삭제 버튼 -->
      <div style="padding: 12px 18px; border-bottom: 1px solid #f1f3f5;">
        <button id="delete-all-btn" title="모두 삭제" 
          style="background: none; border: 1px solid #dc3545; color: #dc3545; font-size: 0.8rem; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: all 0.2s; width: 100%;">
          모두 삭제
        </button>
      </div>
      <div id="loading-spinner" style="text-align: center; padding: 2rem; display: none;">
        <div style="border: 4px solid #f3f3f3; border-top: 4px solid #007bff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto;"></div>
        <p style="margin-top: 1rem; color: #6c757d;">로딩 중...</p>
      </div>
      <div id="history-list" style="padding: 1rem 1rem 1rem 1rem;">
        <p style="text-align: center; color: #6c757d; padding: 2rem;">히스토리를 불러오는 중...</p>
      </div>
    </div>

    <!-- 미니 사이드바 버튼 -->
    <button id="mini-sidebar-btn"
      style="display: none; position: absolute; left: 0; top: 16px; width: 36px; height: 44px; background: none; border: none; border-radius: 0 8px 8px 0; box-shadow: none; align-items: center; justify-content: center; z-index: 20; cursor: pointer;">
      <svg width="22" height="22" viewBox="0 0 20 20" fill="none"><path d="M7 5L12 10L7 15" stroke="#1976d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div id="result-panel" style="flex: 1; padding: 2rem; overflow-y: auto; background: #ffffff;">
      <div id="welcome-message" style="text-align: center; padding: 4rem 2rem; color: #6c757d;">
        <div style="font-size: 4rem; margin-bottom: 1rem;">📈</div>
        <h2 style="color: #495057; margin-bottom: 1rem;">분석 결과 대시보드</h2>
        <p>좌측에서 분석 히스토리를 선택하면 결과를 확인할 수 있습니다.</p>
      </div>
      
      <div id="analysis-result" style="display: none;">
      </div>

/* 분석 히스토리 불러오기 */
function loadAnalysisHistory() {
  showLoading(true);
  
  fetch('/api/analysis/history/')
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        analysisHistory = data.history;
        renderHistoryList(data.history);
      } else {
        showError('히스토리를 불러오는데 실패했습니다: ' + data.error);
      }
    })
    .catch(error => {
      showError('네트워크 오류가 발생했습니다.');
    })
    .finally(() => {
      showLoading(false);
    });
}

function formatLocalTime(utcString) {
  if (!utcString) return '';
  /* ISO 포맷이 아니면 'Z'를 붙여서 UTC로 인식 */
  let date = new Date(utcString.endsWith('Z') ? utcString : utcString + 'Z');
  return date.toLocaleString();
}

function formatDateAndTime(utcString) {
  if (!utcString) return { date: '', time: '' };
  /* ISO 포맷이 아니면 'Z'를 붙여서 UTC로 인식 */
  let date = new Date(utcString.endsWith('Z') ? utcString : utcString + 'Z');
  const dateStr = date.toLocaleDateString('ko-KR');
  const timeStr = date.toLocaleTimeString('ko-KR', { hour12: true });
  return { date: dateStr, time: timeStr };
}

function renderHistoryList(history) {
  const listContainer = document.getElementById('history-list');
  if (history.length === 0) {
    listContainer.innerHTML = `
      <div style="text-align: center; padding: 2rem; color: #6c757d;">

        <p>분석 기록이 없습니다.</p>

    `;
    return;

  const historyHTML = history.map(item => {
    const dateTime = formatDateAndTime(item.created_at);

    <div class="history-item" data-session-id="${item.session_id}" onclick="loadAnalysisDetail('${item.session_id}')">
      <div style="flex: 1; min-width: 0;">

        </div>
      </div>
      <div style="display: flex; align-items: center;">
        <button class="rename-btn" title="이름 변경" onclick="event.stopPropagation(); renameAnalysisDirect('${item.session_id}')" style="color:#1976d2;">✏️</button>
        <button class="delete-btn" title="삭제" onclick="event.stopPropagation(); deleteAnalysisDirect('${item.session_id}')" style="color:#dc3545;">🗑️</button>
      </div>

/* 이름변경/삭제 직접 함수 */
function renameAnalysisDirect(sessionId) {
  const currentItem = analysisHistory.find(item => item.session_id === sessionId);
  if (!currentItem) return;
  const newName = prompt('새 이름을 입력하세요:', currentItem.full_filename);
  if (newName && newName.trim() && newName !== currentItem.full_filename) {
    fetch(`/api/analysis/rename/${sessionId}/`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-CSRFToken': getCookie('csrftoken')
      },
      body: JSON.stringify({ filename: newName.trim() })
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        loadAnalysisHistory();
        alert('이름이 변경되었습니다.');
      } else {
        alert('이름 변경 실패: ' + data.error);
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('네트워크 오류가 발생했습니다.');
    });
  }
}

function deleteAnalysisDirect(sessionId) {
  if (!confirm('이 분석 기록을 삭제하시겠습니까?')) return;
  fetch(`/api/analysis/delete/${sessionId}/`, { method: 'DELETE' })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        loadAnalysisHistory();
        if (currentSessionId === sessionId) {
          document.getElementById('welcome-message').style.display = 'block';
          document.getElementById('analysis-result').style.display = 'none';

      } else {

      }
    })
    .catch(error => {

      alert('네트워크 오류가 발생했습니다.');
    });

/* CSRF 토큰 가져오기 */
function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== '') {
    const cookies = document.cookie.split(';');
    for (let i = 0; i < cookies.length; i++) {
      const cookie = cookies[i].trim();
      if (cookie.substring(0, name.length + 1) === (name + '=')) {
        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}

function downloadCSV(sessionId, filename, type) {
  fetch(`/api/analysis/download/${sessionId}/?type=${type}`)
    .then(response => {
      if (!response.ok) throw new Error('다운로드 실패');
      return response.blob();
    })
    .then(blob => {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename + (type === 'all' ? '_전체.csv' : '_이상치.csv');
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    })
    .catch(() => alert('CSV 다운로드에 실패했습니다.'));
}

function attachShapClickHandlers() {
  const rows = document.querySelectorAll("table tbody tr");

  rows.forEach((row, index) => {
    row.addEventListener("click", () => {

      /* 이전 선택된 행에서 강조 스타일 제거 */
      document.querySelectorAll("table tbody tr").forEach(r => {
        r.classList.remove("selected-row");
      });

      /* 현재 클릭된 행에 강조 스타일 추가 */
      row.classList.add("selected-row");

      /* 1. SHAP 설명 그래프 요청 */
      fetch(`/api/analysis/explain/${currentSessionId}/${index}/`)
        .then(res => res.json())
        .then(data => {
          if (data.success) {
            document.getElementById("shap-plot").innerHTML = data.plot_html;

            let explanationHtml = "";
            
            /* 중간 멘트 추가 */
            if (data.shap_middle_html) {
              explanationHtml += data.shap_middle_html;
            }
            
            if (data.shap_explanation) {
              explanationHtml += data.shap_explanation;  
            }

            /* 설명 영역에 HTML 삽입 */
            document.getElementById("shap-explanation").innerHTML = explanationHtml;

          } else {
            document.getElementById("shap-plot").innerHTML =
              `<p style="color:red;">SHAP 오류: ${data.error}</p>`;
            document.getElementById("shap-explanation").innerHTML =
              `<p style="color:red;">설명을 불러올 수 없습니다.</p>`;
          }
        })
        .catch(error => {
          console.error('SHAP 요청 오류:', error);
          document.getElementById("shap-plot").innerHTML =
            `<p style="color:red;">SHAP 그래프를 불러오는 중 오류가 발생했습니다.</p>`;
          document.getElementById("shap-explanation").innerHTML =
            `<p style="color:red;">설명을 불러오는 중 오류가 발생했습니다.</p>`;
        });
    });
  });
}

/* 사이드바 토글 기능 */
const sidebar = document.getElementById('history-sidebar');
const toggleBtn = document.getElementById('toggle-sidebar-btn');
const miniSidebarBtn = document.getElementById('mini-sidebar-btn');
let sidebarOpen = true;

toggleBtn.onclick = function() {
  sidebarOpen = false;
  sidebar.style.width = '0';
  sidebar.style.minWidth = '0';
  sidebar.style.padding = '0';
  sidebar.style.overflow = 'hidden';
  toggleBtn.style.display = 'none';
  miniSidebarBtn.style.display = 'flex';
};

miniSidebarBtn.onclick = function() {
  sidebarOpen = true;
  sidebar.style.width = '300px';
  sidebar.style.minWidth = '0';
  sidebar.style.padding = '0 0 0 0';
  setTimeout(() => {
    sidebar.style.padding = '';
  }, 250);
  toggleBtn.style.display = 'inline-block';
  miniSidebarBtn.style.display = 'none';
};

function goToViewAll() {
  if (currentSessionId) {
    const url = `/anomaly-search/?session_id=${currentSessionId}`;
    window.location.href = url;
  } else {
    window.location.href = '/anomaly-search/';
  }
}

function goToHourViewAll() {
  if (currentSessionId) {
    const url = `/anomaly_by_hour/?session_id=${currentSessionId}`;
    window.location.href = url;
  } else {
    window.location.href = '/anomaly_by_hour/';
  }
}

</script>
<script>
  (function () {
    // 첫 방문(세션 기준)에서만 스플래시 표시
    const key = 'splashShown';
    const alreadyShown = sessionStorage.getItem(key);
    const splash = document.getElementById('splash');

    if (!splash) return; 

    if (alreadyShown) {

      splash.classList.add('hide');
      splash.style.display = 'none';
      return;
    }

    setTimeout(() => {
      splash.classList.add('hide');
      setTimeout(() => {
        splash.style.display = 'none';
      }, 320);
      sessionStorage.setItem(key, '1');
    }, 2000); 
  })();
</script>
