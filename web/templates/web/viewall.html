<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이상로그 사용자 검색</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

  <style>
    body {
      background: #f5f7fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    .wrapper {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    .graph-section {
      background: #fff;
      border-radius: 12px;
      border: 1.5px solid #e9ecef;
      padding: 1.5rem;
      box-shadow: 0 2px 12px rgba(23, 58, 125, 0.06);
      margin-bottom: 2rem;
    }

    .graph-title {
      font-size: 1.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #333;
    }

    .graph-container {
      width: 100%;
      height: 500px;
      background: #f9fafb;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #666;
      overflow: visible; 
      position: relative; 
    }

    .graph-container .plotly-graph-div {
      width: 100% !important;
      height: 100% !important;
      min-height: 500px !important;
    }

    .graph-container > div {
      width: 100%;
      height: 100%;
    }

    .content-section {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
    }

    .left-panel {
      flex: 1 1 400px;
      background: #f8f9fa;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      padding: 2rem;
    }

    .right-panel {
      flex: 1 1 400px;
      background: #fefefe;
      border-radius: 8px;
      border: 1px solid #e9ecef;
      padding: 2rem;
    }

    h2 {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color: #333;
    }

    .form-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .form-group input,
    .form-group button {
      padding: 0.5rem;
      border-radius: 4px;
      border: 1px solid #dee2e6;
    }

    .form-group button {
      background: #007bff;
      color: white;
      cursor: pointer;
      border: none;
    }

    .form-group button.green {
      background: #28a745;
    }

    .result-box {
      margin-top: 1rem;
    }

    .description-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 1rem;
    }

    .description-content {
      line-height: 1.6;
      color: #555;
    }

    .error {
      color: #dc3545;
    }

    .success {
      color: #28a745;
      font-weight: bold;
    }

    .loading {
      color: #007bff;
      font-style: italic;
    }

    .dashboard-button {
      background-color: rgb(225, 222, 222);
      color: black;
      padding: 0.5rem 1rem;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .dashboard-button:hover {
      background-color: gray;
    }

  </style>
</head>
<body>
  <div class="wrapper">
    <!-- 상단 그래프 -->
    <div class="graph-section">
      <div class="graph-title-bar" style="display: flex; flex-direction: column; gap: 0.6rem; width: 100%; margin-bottom: 1rem;">
        <div class="graph-title" style="text-align: center; font-size: 1.6rem;">사용자별 이상 로그 그래프</div>
        <div style="display: flex; gap: 10px; align-items: center; align-self: flex-end;">
          <button id="show-more-btn" onclick="toggleShowMore()" class="dashboard-button" style="background-color: #007bff; color: white;">
            더보기
          </button>
          <a href="{% url 'web:dashboard' %}" class="dashboard-button">대시보드</a>
        </div>
      </div>
      <div id="graph-container" class="graph-container">
        <div class="loading">그래프를 로딩하는 중...</div>
      </div>
    </div>

    <!-- 검색 + 설명 영역 -->
    <div class="content-section">
      <!-- 좌측 검색/필터 -->
      <div class="left-panel">
        <h2>Filter</h2>

        <form id="username-search-form" class="form-group">
          <input type="text" id="username-input" placeholder="사용자명을 입력하세요" style="flex: 1;">
          <button type="submit">검색</button>
        </form>
        <div id="username-search-result" class="result-box"></div>

        <form id="top-users-form" class="form-group" style="margin-top: 2rem;">
          <input type="number" id="top-n-input" min="1" style="width: 100px;" placeholder="상위 N명">
          <button type="submit" class="green">조회</button>
        </form>
        <div id="top-users-result" class="result-box"></div>
      </div>

      <!-- 우측 설명 -->
      <div class="right-panel">
        <div class="description-title"><h3 style="color:red;">📍설명</h3></div>
        <div class="description-content" id="description-content">

        </div>
      </div>
    </div>
  </div>

  <script>
    let isShowingMore = false;  // 더보기 상태 관리
    
    function toggleShowMore() {
      isShowingMore = !isShowingMore;
      loadGraph(isShowingMore);
      
      const btn = document.getElementById('show-more-btn');
      btn.textContent = isShowingMore ? '기본 보기' : '더보기';
      btn.style.backgroundColor = isShowingMore ? '#28a745' : '#007bff';
    }
    
    function loadGraph(showMore = false) {
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      
      let apiUrl = '/api/get_user_graph/';
      const params = new URLSearchParams();
      
      if (sessionId) {
        params.append('session_id', sessionId);
      }
      if (showMore) {
        params.append('show_more', 'true');
      }
      
      if (params.toString()) {
        apiUrl += '?' + params.toString();
      }
      
      const container = document.getElementById('graph-container');
      container.innerHTML = '<div class="loading">그래프를 로딩하는 중...</div>';
      
      fetch(apiUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }
          return response.text();
        })
        .then(html => {
          container.innerHTML = html;
          
          setTimeout(() => {
            const plotlyDiv = container.querySelector('.plotly-graph-div');
            const scripts = container.querySelectorAll('script');
            
            scripts.forEach((script, index) => {
              if (script.innerHTML.includes('Plotly.newPlot')) {
                try {
                  const newScript = document.createElement('script');
                  newScript.innerHTML = script.innerHTML;
                  script.parentNode.replaceChild(newScript, script);
                } catch (e) {
                }
              }
            });
            
            if (plotlyDiv && window.Plotly) {
              try {
                window.Plotly.Plots.resize(plotlyDiv);
              } catch (e) {
              }
            }
            
            setTimeout(() => {
              const finalPlotlyDiv = container.querySelector('.plotly-graph-div');
              if (finalPlotlyDiv) {
                const rect = finalPlotlyDiv.getBoundingClientRect();
                
                if (window.Plotly && finalPlotlyDiv.id) {
                  window.Plotly.redraw(finalPlotlyDiv.id);
                }
              }
            }, 1000);
            
          }, 100);
        })
        .catch(error => {
          container.innerHTML = `
            <div style="color: #dc3545; text-align: center; padding: 2rem;">
              <h4>그래프 로딩 실패</h4>
              <p>오류: ${error.message}</p>
              <small>브라우저 콘솔을 확인하거나 페이지를 새로고침해보세요.</small>
              <br><br>
              <button onclick="window.location.reload()" style="padding: 0.5rem 1rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">
                페이지 새로고침
              </button>
            </div>
          `;
        });
    }

    function loadTotalAnomalyCount() {
      /* URL 파라미터에서 session_id 읽기 */
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      
      let apiUrl = '/api/anomaly/total/';
      if (sessionId) {
        apiUrl += `?session_id=${sessionId}`;
      }
      
      fetch(apiUrl)
          .then(response => response.json())
          .then(data => {
              const descDiv = document.getElementById('description-content');
              // 대시보드와 동일한 형식으로 표시
              const anomalyCount = Number(data.anomaly_count || 0).toLocaleString('ko-KR');
              const totalCount = Number(data.total || 0).toLocaleString('ko-KR');
              
              descDiv.innerHTML = `
                  <b><span style='color:red;'>전체 이상 로그 건수: ${anomalyCount}건<br>
                  <span style='color:black;'>필터 기능을 사용하여 특정 사용자나 상위 사용자들의 로그를 조회할 수 있습니다.
              `;
          })
          .catch(error => {
              document.getElementById('description-content').innerHTML = 
                  '전체 로그 건수를 불러오는 중 오류가 발생했습니다.';
          });
    }

    window.onload = function () {
      // 초기 그래프 로드
      loadGraph(false);
      loadTotalAnomalyCount();
    };

    /* 사용자명 검색 */
    document.getElementById('username-search-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const username = document.getElementById('username-input').value.trim();
      
      if (!username) {
        document.getElementById('username-search-result').innerHTML = '<span class="error">사용자명을 입력해주세요</span>';
        return;
      }

      document.getElementById('username-search-result').innerHTML = '<span class="loading">검색 중...</span>';
      
      /* URL 파라미터에서 session_id 읽기 */
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      
      let searchUrl = `/api/anomaly/search/?username=${encodeURIComponent(username)}`;
      if (sessionId) {
        searchUrl += `&session_id=${sessionId}`;
      }
      
      fetch(searchUrl)
        .then(response => {
          if (!response.ok) {
            return response.json().then(errorData => {
              throw new Error(errorData.error || `HTTP ${response.status}`);
            });
          }
          return response.json();
        })
        .then(data => {
          const resultDiv = document.getElementById('username-search-result');
          const descDiv = document.getElementById('description-content');
          
          if (data.anomaly_count !== undefined) {
            resultDiv.innerHTML = `<b><span style="color:green;">${data.username}</b></span>의 이상 로그: <b><span style="color:green;">${data.anomaly_count}건</b>`;
            
            /* 전체 로그 수 가져와서 비율 계산 */
            let totalUrl = '/api/anomaly/total/';
            if (sessionId) {
              totalUrl += `?session_id=${sessionId}`;
            }
            
            fetch(totalUrl)
              .then(r => r.json())
              .then(totalData => {
                const a = Number(data.anomaly_count);   
                const b = Number(data.user_total_logs || 0);
                const c = Number(totalData.total_count || 0); 

                const pctUserLogs = (b > 0) ? ((a / b) * 100).toFixed(2) : '0.00';
                const pctGlobal   = (c > 0) ? ((a / c) * 100).toFixed(2) : '0.00';

                // 숫자 포맷 & 색상(span)
                const fmt = n => Number(n).toLocaleString('ko-KR');
                const aSpan = `<span style="color:#d9534f; font-weight:bold;">${fmt(a)}</span>`;   // 빨강
                const bSpan = `<span style="color:#6c757d; font-weight:bold;">${fmt(b)}</span>`;   // 회색
                const cSpan = `<span style="color:#6c757d; font-weight:bold;">${fmt(c)}</span>`;   // 회색

                descDiv.innerHTML = 
                  `<b><span style="color:green;">${data.username}</span></b> 사용자의 이상 로그 분석 결과:<br>
                  • 사용자 이상 로그 수: <b><span style="color:green;">${fmt(a)}건</span></b><br>
                  • 사용자 로그 중 이상 로그 비율: <b><span style="color:green;">${pctUserLogs}%</span></b> <small>(${aSpan}/${bSpan})</small><br>
                  • 전체 이상 로그 중 사용자 비중: <b><span style="color:green;">${pctGlobal}%</span></b> <small>(${aSpan}/${cSpan})</small>`;

              })

              // total 불러오기 실패 시에도, 최소한 a와 b만으로 일부 정보 표기

              .catch(() => {
                
                const a = Number(data.anomaly_count);
                const b = Number(data.user_total_logs || 0);
                const pctUserLogs = (b > 0) ? ((a / b) * 100).toFixed(2) : '0.00';

                const fmt = n => Number(n).toLocaleString('ko-KR');
                const aSpan = `<span style="color:#d9534f; font-weight:bold;">${fmt(a)}</span>`; // 빨강
                const bSpan = `<span style="color:#6c757d; font-weight:bold;">${fmt(b)}</span>`; // 회색

                descDiv.innerHTML =
                  `<b><span style="color:green;">${data.username}</span></b> 사용자의 이상 로그 분석 결과:<br>
                  • 사용자 이상 로그 수: <b><span style="color:green;">${fmt(a)}건</span></b><br>
                  • 사용자 로그 중 이상 로그 비율: <b><span style="color:green;">${pctUserLogs}%</span></b> <small>(${aSpan}/${bSpan})</small><br>
                  • 전체 이상 로그 중 사용자 비중: <span style="color:#999;">불러오기 실패</span> <small>(a/c)</small>`;
              });
              

          } else {
            resultDiv.innerHTML = '<span class="error">결과 없음</span>';
            descDiv.innerHTML = '검색 결과가 없습니다.';
          }
        })
        .catch(error => {
          const message = error.message;
          const resultBox = document.getElementById('username-search-result');

          if (message.includes('정확한 사용자명을 입력해주세요')) {
            resultBox.innerHTML = `<span class="error">정확한 사용자명을 입력해주세요</span>`;
          } else {
            resultBox.innerHTML = `<span class="error">${message}</span>`;
          }
        });
      });

    /* 상위 사용자 조회 */
    document.getElementById('top-users-form').addEventListener('submit', function (e) {
      e.preventDefault();
      const n = parseInt(document.getElementById('top-n-input').value);
      
      if (!n || n < 1) {
        document.getElementById('top-users-result').innerHTML = '<span class="error">1 이상의 숫자를 입력해주세요</span>';
        return;
      }

      document.getElementById('top-users-result').innerHTML = '<span class="loading">조회 중...</span>';
      
      /* URL 파라미터에서 session_id 읽기 */
      const urlParams = new URLSearchParams(window.location.search);
      const sessionId = urlParams.get('session_id');
      
      let topUrl = `/api/anomaly/top/${n}/`;
      if (sessionId) {
        topUrl += `?session_id=${sessionId}`;
      }
      
      fetch(topUrl)
        .then(response => {
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          return response.json();
        })
        .then(data => {
          const resultDiv = document.getElementById('top-users-result');
          const descDiv = document.getElementById('description-content');
          
          if (data.top_users && data.top_users.length > 0) {
            resultDiv.innerHTML = '<h4><b><span style="color:red;">상위 ' + n + '명 사용자</span></h4></b>' +
              data.top_users.map((u, index) => `${index + 1}. ${u.username}: ${u.anomaly_count}건`).join('<br>');
            
            const topTotal = data.top_users.reduce((sum, u) => sum + u.anomaly_count, 0);

            /* 전체 로그 수 가져와서 비율 계산 */
            let totalUrl = '/api/anomaly/total/';
            if (sessionId) {
              totalUrl += `?session_id=${sessionId}`;
            }
            
            fetch(totalUrl)
              .then(r => r.json())
              .then(totalData => {
                const percentage = topTotal > 0 && totalData.total_count > 0 ? 
                  ((topTotal / totalData.total_count) * 100).toFixed(2) : '0.00';
                descDiv.innerHTML = `<b><span style="color:green;">상위 ${n}명</span></b> 사용자 이상 로그 분석 결과:<br>
                    • 상위 ${n}명 총 이상 로그 수: <b><span style="color:green;">${topTotal}건</span></b><br>
                    • 전체 로그 수 대비 비율: <b><span style="color:green;">${percentage}%</span></b><br>
                    • 전체 이상 로그 수: <b><span style="color:green;">${totalData.total_count}건</span></b><br>
                    • 평균 개별 로그 수: <b><span style="color:green;">${Math.round(topTotal/n)}건</span></b>
                `;
              })
              .catch(() => {
                descDiv.innerHTML = `상위 <b>${n}명</b> 사용자의 이상 로그: <b>${topTotal}건</b>`;
              });
          } else {
            resultDiv.innerHTML = '<span class="error">조회 결과 없음</span>';
            descDiv.innerHTML = '조회 결과가 없습니다.';
          }
        })
        .catch(error => {
          document.getElementById('top-users-result').innerHTML = `<span class="error">조회 실패: ${error.message}</span>`;
        });
    });


  </script>

</body>
</html>
