{% extends "web/base.html" %}
{% load static %}
{% block content %}
<div class="upload-main-title">Anomaly Detection</div>
<div class="upload-center-box">
  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
  <form id="uploadForm" enctype="multipart/form-data" style="width:100%;">
    {% csrf_token %}
    <label for="datafile">Log File Upload</label>
    <div class="upload-file-input">
      <label class="upload-file-label" id="fileLabel" onclick="triggerFileInput()">Choose a file</label>
      <input type="file" name="datafile" id="datafile" accept=".log,.txt,.csv,.xlsx" required style="display:none;">
    </div>
    <div class="upload-desc">
      * Please <b>.log, .txt, .csv, .xlsx</b> file
    </div>
    <!-- 칼럼 미리보기/제거 UI -->
    <div id="preview" class="preview-table" style="display:none;"></div>
    <div id="columns" class="columns-checkbox" style="display:none; position:relative;">
      <div class="dropdown-checkbox">
        <button type="button" id="dropdownBtn" class="dropdown-btn">
          칼럼 선택 <span id="dropdown-arrow">▼</span>
        </button>
        <div id="dropdownMenu" class="dropdown-menu" style="display:none;">
          <input type="text" id="dropdownSearch" class="dropdown-search" placeholder="검색...">
          <div id="dropdownOptions" class="dropdown-options"></div>
        </div>
      </div>
    </div>
    <!-- 사용자/시간 칼럼 선택 영역 -->
    <div id="col-select-area" class="col-select-area" style="display:none;">
      <div class="col-select-row">
        <label for="user_col">사용자 칼럼:</label>
        <select name="user_col" id="user_col" required></select>
      </div>
      <div class="col-select-row">
        <label for="time_col">&nbsp;&nbsp;시간 칼럼:&nbsp;</label>
        <select name="time_col" id="time_col" required></select>
      </div>
    </div>
    <button type="submit" class="upload-btn" style="display:block;">Upload & Analyze</button>
  </form>
</div>
<div class="upload-footer">
  &copy; 2025. 이상無조 All rights reserved.
</div>
<style>
  body {
    background: #fff;
  }
  .upload-main-title {
    font-size: 2.4rem;
    font-weight: 700;
    color: #3a465e;
    text-align: center;
    margin-top: 2.5rem;
    margin-bottom: 2.5rem;
    letter-spacing: -1px;
  }
  .upload-center-box {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    max-width: 420px;
    margin: 0 auto;
    padding: 2.5rem 2rem 2rem 2rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 1.5px solid #e0e3e8;
  }
  .upload-center-box label {
    font-size: 1.2rem;
    font-weight: 600;
    color: #3a465e;
    margin-bottom: 1rem;
    display: block;
    text-align: center;
  }
  .upload-file-input {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-bottom: 1.2rem;
    width: 100%;
    justify-content: center;
  }
  .upload-file-label {
    background: #f5f6fa;
    border: 1.5px solid #cfd8dc;
    border-radius: 8px;
    padding: 0.8rem 1.2rem;
    font-size: 1.1rem;
    color: #495057;
    cursor: pointer;
    transition: border 0.2s;
    width: 260px;
    text-align: center;
  }
  .upload-file-label:hover {
    border: 1.5px solid #007bff;
    color: #007bff;
  }
  .upload-desc {
    font-size: 0.95rem;
    color: #888;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .preview-table {
    max-width: 100%;
    max-height: 180px;
    overflow-x: auto;
    overflow-y: auto;
    margin-bottom: 1rem;
    border-radius: 8px;
    border: 1px solid #e0e3e8;
    background: #fafbfc;
    padding: 8px;
  }
  .preview-table table {
    border-collapse: collapse;
    width: max-content;
    min-width: 100%;
    font-size: 0.98rem;
    background: transparent;
  }
  .preview-table th, .preview-table td {
    border: 1px solid #d1d5db;
    padding: 6px 10px;
    text-align: left;
    white-space: nowrap;
  }
  .columns-checkbox {
    display: flex;
    flex-wrap: wrap;
    gap: 10px 18px;
    margin-bottom: 1rem;
    align-items: center;
  }
  .columns-checkbox label {
    font-size: 1rem;
    color: #495057;
    cursor: pointer;
    margin-bottom: 0;
    margin-right: 0;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .upload-btn {
    background: #173a7d;
    color: #fff;
    border: none;
    border-radius: 14px;
    font-size: 1.6rem;
    font-weight: 700;
    padding: 1.2rem 0;
    width: 100%;
    margin-top: 1.2rem;
    cursor: pointer;
    transition: background 0.2s;
    box-shadow: 0 2px 8px rgba(23,58,125,0.08);
  }
  .upload-btn:hover {
    background: #174fa3;
  }
  .error {
    color: #dc3545;
    margin-bottom: 1rem;
    text-align: center;
  }
  .upload-footer {
    text-align: right;
    color: #888;
    font-size: 0.95rem;
    margin-top: 2.5rem;
    margin-right: 2.5rem;
  }
  .col-select-area {
    margin-top: 1rem;
    text-align: center;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .col-select-row {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    gap: 10px;
  }
  .col-select-row label {
    font-size: 1.1rem;
    font-weight: 500;
    margin-right: 8px;
    margin-bottom: 0;
  }
  .col-select-row select {
    min-width: 140px;
    font-size: 1rem;
    padding: 4px 8px;
  }
  .dropdown-checkbox {
    position: relative;
    display: inline-block;
    width: 100%;
  }
  .dropdown-btn {
    background: #f5f6fa;
    border: 1.5px solid #cfd8dc;
    border-radius: 8px;
    padding: 0.8rem 1.2rem;
    font-size: 1.1rem;
    color: #495057;
    cursor: pointer;
    transition: border 0.2s;
    width: 100%;
    text-align: left;
  }
  .dropdown-btn:hover {
    border: 1.5px solid #007bff;
    color: #007bff;
  }
  .dropdown-menu {
    position: absolute;
    z-index: 1000;
    top: 100%;
    left: 0;
    right: 0;
    background: #fff;
    border: 1px solid #e0e3e8;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    margin-top: 0.5rem;
    padding: 0.5rem 0;
  }
  .dropdown-search {
    width: 100%;
    padding: 0.5rem 1rem;
    border: 1px solid #cfd8dc;
    border-radius: 4px;
    font-size: 1rem;
    margin-bottom: 0.5rem;
  }
  .dropdown-options {
    max-height: 200px;
    overflow-y: auto;
    padding: 0 1rem;
  }
  .dropdown-option {
    padding: 0.5rem 0;
    font-size: 1rem;
    color: #495057;
    cursor: pointer;
    transition: background 0.2s;
  }
  .dropdown-option:hover {
    background: #f1f1f1;
  }
</style>
<script>
  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
      const cookies = document.cookie.split(';');
      for (let i = 0; i < cookies.length; i++) {
        const cookie = cookies[i].trim();
        if (cookie.substring(0, name.length + 1) === (name + '=')) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
  const csrftoken = getCookie('csrftoken');

  function triggerFileInput() {
    document.getElementById('datafile').click();
  }
  document.getElementById('datafile').onchange = function() {
    const label = document.getElementById('fileLabel');
    if (this.files.length > 0) {
      label.textContent = this.files[0].name;
      const file = this.files[0];
      const formData = new FormData();
      formData.append("file", file);
      fetch("{% url 'web:preview_columns' %}", {
        method: "POST",
        body: formData,
        headers: {'X-CSRFToken': csrftoken}
      })
        .then(r => r.json())
        .then(data => {
          // 칼럼 체크박스
          let html = "<b>제외할 칼럼 선택:</b>";
          data.columns.forEach(col => {
            html += `<label><input type="checkbox" name="exclude" value="${col}"> ${col}</label>`;
          });
          document.getElementById('columns').innerHTML = html;
          document.getElementById('columns').style.display = "flex";
          // 미리보기 테이블
          let table = "<table><tr>";
          data.columns.forEach(col => table += `<th>${col}</th>`);
          table += "</tr>";
          data.preview.forEach(row => {
            table += "<tr>";
            data.columns.forEach(col => table += `<td>${row[col]}</td>`);
            table += "</tr>";
          });
          table += "</table>";
          document.getElementById('preview').innerHTML = table;
          document.getElementById('preview').style.display = "block";
          // 사용자/시간 칼럼 드롭다운
          let userSel = document.getElementById('user_col');
          let timeSel = document.getElementById('time_col');
          userSel.innerHTML = "";
          timeSel.innerHTML = "";
          data.columns.forEach(col => {
            userSel.innerHTML += `<option value="${col}">${col}</option>`;
            timeSel.innerHTML += `<option value="${col}">${col}</option>`;
          });
          document.getElementById('col-select-area').style.display = "block";
          document.querySelector('.upload-btn').style.display = "block";
          // 드롭다운 옵션만 동적으로 생성
          let optionsHtml = "";
          data.columns.forEach(col => {
            optionsHtml += `<label><input type="checkbox" name="exclude" value="${col}"> ${col}</label>`;
          });
          document.getElementById('dropdownOptions').innerHTML = optionsHtml;
          document.getElementById('columns').style.display = "block";
        });
    } else {
      label.textContent = "Choose a file";
      document.getElementById('preview').innerHTML = "";
      document.getElementById('preview').style.display = "none";
      document.getElementById('columns').innerHTML = "";
      document.getElementById('columns').style.display = "none";
      document.querySelector('.upload-btn').style.display = "none";
      document.getElementById('col-select-area').style.display = "none";
    }
  };

  document.getElementById('uploadForm').onsubmit = function(e) {
    e.preventDefault();
    const file = document.getElementById('datafile').files[0];
    const formData = new FormData();
    formData.append("file", file);
    const exclude = [...document.querySelectorAll('input[name="exclude"]:checked')].map(cb => cb.value);
    formData.append("exclude_columns", exclude.join(","));
    const userCol = document.getElementById('user_col').value;
    const timeCol = document.getElementById('time_col').value;
    formData.append("user_col", userCol);
    formData.append("time_col", timeCol);
    fetch("{% url 'web:detect_anomalies' %}", {
      method: "POST",
      body: formData,
      headers: {'X-CSRFToken': csrftoken}
    })
      .then(r => r.json())
      .then(data => {
        alert("분석 완료! 대시보드에서 결과를 확인하세요.");
        window.location.href = "{% url 'web:dashboard' %}";
      });
  };

  // 드롭다운 관련 스크립트
  document.getElementById('dropdownBtn').onclick = function() {
    const menu = document.getElementById('dropdownMenu');
    menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
  }

  document.getElementById('dropdownSearch').onkeyup = function() {
    const searchTerm = this.value.toLowerCase();
    const options = document.querySelectorAll('.dropdown-option');
    options.forEach(option => {
      const text = option.textContent.toLowerCase();
      option.style.display = text.includes(searchTerm) ? 'block' : 'none';
    });
  }

  document.getElementById('dropdownOptions').onclick = function(e) {
    if (e.target.classList.contains('dropdown-option')) {
      const value = e.target.getAttribute('data-value');
      const label = e.target.textContent;
      const checkbox = `<label><input type="checkbox" name="exclude" value="${value}"> ${label}</label>`;
      document.getElementById('columns').insertAdjacentHTML('beforeend', checkbox);
      const event = new Event('change');
      document.getElementById('datafile').dispatchEvent(event);
    }
  }

  document.addEventListener('click', function(e) {
    const menu = document.getElementById('dropdownMenu');
    if (!document.getElementById('dropdownBtn').contains(e.target) && !menu.contains(e.target)) {
      menu.style.display = 'none';
    }
  });

  // 전체 선택/해제 체크박스 추가
  if (!document.getElementById('selectAllColumns')) {
    const selectAllDiv = document.createElement('div');
    selectAllDiv.innerHTML = `
      <label style="font-size:0.98rem;cursor:pointer;">
        <input type="checkbox" id="selectAllColumns" style="margin-right:6px;"> 전체 선택/해제
      </label>
    `;
    document.getElementById('dropdownMenu').insertBefore(selectAllDiv, document.getElementById('dropdownOptions'));
  }
  document.getElementById('selectAllColumns').onclick = function() {
    const checked = this.checked;
    document.querySelectorAll('#dropdownOptions input[type="checkbox"]').forEach(cb => {
      cb.checked = checked;
    });
  };
</script>
{% endblock %}
